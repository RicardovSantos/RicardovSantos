name: Gerar animação da cobra

# Gera os SVGs da cobra que percorre o gráfico de contribuições
# e publica na branch "output" (é de lá que o README lê as imagens).
on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00E5A0&color_dots=#0D1117,#2A0A4F,#4A12A0,#6117C4,#A78BFA

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
